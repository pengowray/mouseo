# Settings for naga-daemon (~/.local/bin/naga-daemon). Restart it after editing:
#   systemctl --user restart naga-daemon
#
# The mouse sends these keys (set in ~/projects/mouseo/layout.py), and the daemon gives them their behaviour:
#   Thumb 1  (F24)  hold + wheel: screen zoom (Super+= / Super+-).
#   Thumb 2  (F19)  tap: middle click.   Hold + wheel: change DPI.
#   Thumb 4  (Ro)   hold + wheel: brightness of the monitor with the focused window.
#                   Hold + tilt left / right: warmer / cooler colour preset.
#                   Hold + middle click: switch both monitors between night (Warm 3) and day
#                   (5000 K, LG 6500 K), using monitor-night-light.
#   Thumb 8  (F13)  hold + wheel: volume of the focused app.
#   Thumb 9  (F14)  hold + wheel: Spotify volume.
#   Thumb 7  (F17)  hold + wheel: volume of another app playing sound (not focused, not Spotify).
#   Thumb 12 (F15)  hold + wheel: playback speed.
#   Thumb 11 (F16)  hold + wheel: fine playback speed.
# While holding thumb 7, 8 or 9:   middle click = play/pause, tilt left/right = previous/next track,
#                                  sent to the app that thumb 7, 8 or 9 controls.
# While holding thumb 11 or 12:    middle click = play/pause, tilt left/right = seek back/forward.
#
# Keys are evdev key names without the KEY_ prefix, joined with "+": "shift+dot", "alt+left".
# Leave a key out of a profile to do nothing in that app.

dpi_step = 50                # DPI change per wheel step (thumb 2)
dpi_min = 200                # the notification bar is empty at dpi_min and full at dpi_max
dpi_max = 2400
volume_step = 2              # percent per wheel step (thumbs 7, 8 and 9)
brightness_step = 5          # percent per wheel step (thumb 4)

# Tilt right and top button 2 send F18, which Discord can't bind. The daemon sends this mouse
# button instead. Browsers ignore it. Use "key_f18" to pass F18 through unchanged.
# For push to talk while Discord is in the background, turn on COSMIC Settings > Applications >
# X11 applications compatibility > "Mouse button events in X11 applications".
push_to_talk = "btn_task"    # mouse button 12; "btn_forward" and "btn_back" are 10 and 11

# Which keys to send while holding thumb 11 or 12, by focused app.
# "apps" matches part of the window's app_id, ignoring case.
# The first profile that matches is used, and "default" is used when none match.

[profiles.browser]
apps = ["firefox", "chrome", "chromium", "brave", "vivaldi", "librewolf"]
faster = "shift+dot"         # YouTube speed up
slower = "shift+comma"       # YouTube speed down
faster_fine = "dot"          # your YouTube speed plugin's small steps
slower_fine = "comma"
back = "left"                # YouTube: 5 seconds
forward = "right"
play_pause = "space"

[profiles.vlc]
apps = ["vlc"]
faster = "kpplus"
slower = "kpminus"
faster_fine = "rightbrace"   # ]
slower_fine = "leftbrace"    # [
back = "alt+left"            # 10 seconds
forward = "alt+right"
play_pause = "space"

[profiles.cosmic_player]
apps = ["cosmicplayer"]
back = "left"
forward = "right"
faster_fine = "dot"          # COSMIC Player has no speed keys, so this steps one frame
slower_fine = "comma"
play_pause = "space"

[profiles.default]
back = "left"
forward = "right"
play_pause = "playpause"

# Colour presets for thumb 4 + tilt, warmest first, by monitor serial number.
# An entry can add gains = [red, green, blue] (0-100), set after selecting the preset.
# List a monitor's presets with: ddcutil --sn SERIAL capabilities  (feature 14)
# monitor-night-light also sets these presets at 22:30 and 06:00.

[monitors.304NTJJ4A468]      # LG ULTRAGEAR, DP-1
# Warm 1 is the User 1 setting monitor-night-light uses at night (it sets these gains at 22:30).
colour_presets = [
    { value = 0x0b, name = "Warm 3", gains = [50, 32, 12] },
    { value = 0x0b, name = "Warm 2", gains = [50, 37, 20] },
    { value = 0x0b, name = "Warm 1 (night)", gains = [50, 42, 28] },
    { value = 0x05, name = "6500 K" },
    { value = 0x08, name = "9300 K" },
]

[monitors.UHB1733028185]     # Philips 271S7Q, DP-2
# The Warm steps imitate the monitor's LowBlue Mode, which can't be switched over DDC/CI:
# preset User 1 (0x0b) with red, green and blue gains. Turn LowBlue off in the monitor's menu,
# or it blocks all preset changes.
colour_presets = [
    { value = 0x0b, name = "Warm 3", gains = [100, 78, 45] },
    { value = 0x0b, name = "Warm 2", gains = [100, 86, 62] },
    { value = 0x0b, name = "Warm 1", gains = [100, 93, 78] },
    { value = 0x04, name = "5000 K" },
    { value = 0x05, name = "6500 K" },
    { value = 0x06, name = "7500 K" },
    { value = 0x07, name = "8200 K" },
    { value = 0x08, name = "9300 K" },
    { value = 0x0a, name = "11500 K" },
]
