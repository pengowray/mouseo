[package]
name = "cosmic-window-watch"
version = "0.1.0"
edition = "2024"
description = "Prints the focused COSMIC window's app id and geometry as JSON lines whenever they change"
license = "MIT"

[dependencies]
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d" }
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
