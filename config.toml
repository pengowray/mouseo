# Settings for naga-daemon.py.
#
# The mouse sends these keys (set in layout.py), and the daemon gives them their behaviour:
#   Thumb 1  (F24)  hold + wheel: screen zoom (Super+= / Super+-).
#   Thumb 3  (F19)  tap: Ctrl+Home.   Hold + wheel: change DPI.
#   Thumb 8  (F13)  hold + wheel: volume of the focused app.
#   Thumb 9  (F14)  hold + wheel: Spotify volume.
#   Thumb 12 (F15)  hold + wheel: playback speed.
#   Thumb 11 (F16)  hold + wheel: fine playback speed.
# While holding thumb 8 or 9:      middle click = play/pause, tilt left/right = previous/next track,
#                                  sent to the focused app (thumb 8) or Spotify (thumb 9).
# While holding thumb 11 or 12:    middle click = play/pause, tilt left/right = seek back/forward.
#
# Keys are evdev key names without the KEY_ prefix, joined with "+": "shift+dot", "alt+left".
# Leave a key out of a profile to do nothing in that app.

dpi_step = 50                # DPI change per wheel step (thumb 3)
dpi_min = 200                # the notification bar is empty at dpi_min and full at dpi_max
dpi_max = 2400
volume_step = 2              # percent per wheel step (thumbs 8 and 9)

# Tilt right and top button 2 send F18, which Discord can't bind. The daemon sends this mouse
# button instead. Browsers ignore it. Use "key_f18" to pass F18 through unchanged.
# For push to talk while Discord is in the background, turn on COSMIC Settings > Applications >
# X11 applications compatibility > "Mouse button events in X11 applications".
push_to_talk = "btn_task"    # mouse button 12; "btn_forward" and "btn_back" are 10 and 11

# Which keys to send while holding thumb 11 or 12, by focused app.
# "apps" matches part of the window's app_id, ignoring case.
# The first profile that matches is used, and "default" is used when none match.

[profiles.browser]
apps = ["firefox", "chrome", "chromium", "brave", "vivaldi", "librewolf"]
faster = "shift+dot"         # YouTube speed up
slower = "shift+comma"       # YouTube speed down
faster_fine = "dot"          # your YouTube speed plugin's small steps
slower_fine = "comma"
back = "left"                # YouTube: 5 seconds
forward = "right"
play_pause = "space"

[profiles.vlc]
apps = ["vlc"]
faster = "kpplus"
slower = "kpminus"
faster_fine = "rightbrace"   # ]
slower_fine = "leftbrace"    # [
back = "alt+left"            # 10 seconds
forward = "alt+right"
play_pause = "space"

[profiles.cosmic_player]
apps = ["cosmicplayer"]
back = "left"
forward = "right"
faster_fine = "dot"          # COSMIC Player has no speed keys, so this steps one frame
slower_fine = "comma"
play_pause = "space"

[profiles.default]
back = "left"
forward = "right"
play_pause = "playpause"
